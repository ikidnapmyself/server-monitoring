<time class="c-muted" datetime="{{ entry.when|date:'c' }}" title="{{ entry.when|date:'Y-m-d H:i:s T' }}">{{ entry.when|date:'M j H:i:s' }}</time>
<span><span class="c-badge c-tone-{{ entry.tone }}">{% if entry.kind == "alert_history" %}alert{% elif entry.kind == "pipeline" %}run{% else %}{{ entry.kind }}{% endif %}</span></span>
