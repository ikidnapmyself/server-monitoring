<a id="provider-delete-back" class="c-crumb" href="{{ deletion.back_url }}">{% include "console/partials/_octicon.html" with name="chevron-right" %}Back to provider {{ deletion.name }}</a>
<div class="c-pagehead"><div class="c-pagehead__top"><h1 class="c-pagehead__title">Delete provider {{ deletion.name }}?</h1></div></div>
<section class="c-box c-comment">
  <h2 class="c-box__header c-box__title">What deleting does</h2>
  <div id="provider-delete-consequence" class="c-box__body"><p>{{ deletion.consequence }}</p></div>
</section>
<form method="post" action="{{ deletion.url }}" data-disable-on-submit>
  {% csrf_token %}
  <button id="provider-delete-confirm" class="c-button c-button--danger" type="submit">Delete provider</button>
  <a id="provider-delete-cancel" class="c-button" href="{{ deletion.back_url }}">Cancel</a>
</form>
