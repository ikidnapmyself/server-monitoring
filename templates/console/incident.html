{% extends "console/base.html" %}
{% block title %}{{ incident.title }} · Console{% endblock %}
{% block content %}
{% for message in messages %}
<p class="c-notice c-tone-{% if message.level_tag == "success" %}ok{% elif message.level_tag == "warning" %}warning{% elif message.level_tag == "error" %}critical{% else %}info{% endif %}" role="status">{{ message }}</p>
{% endfor %}
<div id="incident" data-poll hx-get="{{ incident.url }}" hx-trigger="every 30s, console:refresh" hx-swap="innerHTML">
  {% include "console/partials/_incident.html" %}
</div>
{% endblock %}
