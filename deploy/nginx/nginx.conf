# nginx site config for Server Monitoring.
#
# Defaults target a self-managed VPS: systemd runs gunicorn on a unix socket
# (see deploy/systemd/server-monitoring.service) and static files are collected
# to /opt/server-monitoring/staticfiles/.
#
# For a Docker/Compose upstream instead, swap the `upstream` block and the
# /static/ alias for the commented Docker values noted inline below.
#
# Install (self-managed VPS):
#   sudo cp deploy/nginx/nginx.conf /etc/nginx/sites-available/server-monitoring
#   sudo ln -s /etc/nginx/sites-available/server-monitoring /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream django {
    # systemd (default): gunicorn on a unix socket.
    server unix:/run/server-monitoring/gunicorn.sock;

    # Docker/Compose: comment the line above and use the web service instead.
    # server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    location /static/ {
        # systemd (default):
        alias /opt/server-monitoring/staticfiles/;
        # Docker: alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

