# nginx edits for a managed VPS panel (Laravel Forge and similar).
#
# Forge lets you edit ONLY inside the generated `server {}` block, and it already ships a
# default site. You do not paste a whole file — you make three small edits inside the
# server {} block and leave everything else (the `include forge-conf/.../server/*;` line,
# the security headers, the favicon/robots rules) exactly as Forge generated it.
#
# There is no `upstream {}` block here on purpose: `upstream` is an http-level directive
# and Forge won't let you add one. Instead we proxy straight to the gunicorn unix socket.
# The socket path must match the Daemon you configure (see deploy/forge/README.md).
# Paths assume the Forge default checkout at /home/forge/server — adjust if different.

# ---------------------------------------------------------------------------
# EDIT 1 — REPLACE the default location block.
#
# Forge generates:
#     location / {
#         try_files $uri $uri/ =404;
#     }
#
# Replace it entirely with this (nginx rejects two `location /` blocks):
# ---------------------------------------------------------------------------
location / {
    proxy_pass http://unix:/home/forge/server/gunicorn.sock;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

# ---------------------------------------------------------------------------
# EDIT 2 — ADD a static block so nginx serves collected assets directly.
# Place it above the `location /` block. Keep Forge's favicon/robots rules as-is.
# ---------------------------------------------------------------------------
location /static/ {
    alias /home/forge/server/staticfiles/;
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# ---------------------------------------------------------------------------
# EDIT 3 — ADD near the top of server {} (e.g. next to `charset utf-8;`),
# so webhook payloads aren't capped at nginx's small default:
# ---------------------------------------------------------------------------
# client_max_body_size 10M;
#
# ---------------------------------------------------------------------------
# Leave untouched:
#   include forge-conf/<id>/server/*;   (FORGE CONFIG — do not remove)
#   ssl_* directives, add_header security headers, index/charset,
#   favicon/robots/well-known location rules, access_log/error_log.
# SSL is managed by Forge's SSL tab — do not add ssl_certificate lines by hand.
