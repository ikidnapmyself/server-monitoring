services:
  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8000}:8000"
    env_file: ../../.env
    volumes:
      - db-data:/app/data

  # Broker-free durable-ingest drain: processes PENDING pipeline runs recorded by
  # the webhook. Required — without it, alerts are recorded but never processed.
  inbox:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    command: python manage.py process_inbox --loop --interval 5 --limit 100
    env_file: ../../.env
    volumes:
      - db-data:/app/data

volumes:
  db-data:
