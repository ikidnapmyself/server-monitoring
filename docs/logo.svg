<svg xmlns="http://www.w3.org/2000/svg" width="680" height="200" viewBox="0 0 680 200">
  <defs>
    <style>
      .bg    { fill: #f6f8fa; }
      .panel { fill: #eef6f0; stroke: #2da672; stroke-width: 1.5; }
      .bay   { fill: #c6ebd6; }
      .d1    { fill: #1d9e75; }
      .d2    { fill: #3b82f6; }
      .d3    { fill: #f59e0b; }
      .t1    { fill: #111827; }
      .t2    { fill: #4b5563; }
      .t3    { fill: #6b7280; }
      .acc   { fill: #1d9e75; }
      .div   { stroke: #1d9e75; }

      @media (prefers-color-scheme: dark) {
        .bg    { fill: #0d1117; }
        .panel { fill: #0e2318; stroke: #2da672; }
        .bay   { fill: #163320; }
        .t1    { fill: #e6edf3; }
        .t2    { fill: #8b949e; }
        .t3    { fill: #6e7681; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="680" height="200" rx="12" class="bg"/>

  <!-- Server panel: clean rectangle, no corner ornaments -->
  <rect x="44" y="40" width="108" height="120" rx="10" class="panel"/>

  <!-- Top accent strip (like a power rail) -->
  <rect x="58" y="50" width="78" height="3" rx="1.5" class="d1" opacity="0.45"/>

  <!-- Bay 1 -->
  <rect x="58" y="64" width="62" height="13" rx="3" class="bay"/>
  <circle cx="133" cy="70.5" r="4.5" class="d1"/>

  <!-- Bay 2 -->
  <rect x="58" y="90" width="62" height="13" rx="3" class="bay"/>
  <circle cx="133" cy="96.5" r="4.5" class="d2"/>

  <!-- Bay 3 -->
  <rect x="58" y="116" width="62" height="13" rx="3" class="bay"/>
  <circle cx="133" cy="122.5" r="4.5" class="d3"/>

  <!-- Thin vertical divider -->
  <line x1="178" y1="46" x2="178" y2="154" class="div" stroke-width="1" opacity="0.2"/>

  <!-- Product name -->
  <text x="202" y="84"
        class="t1"
        font-family='ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace'
        font-size="28"
        font-weight="600">server-monitoring</text>

  <!-- Tagline -->
  <text x="202" y="110"
        class="t2"
        font-family='ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace'
        font-size="12">maintenance · monitoring · workflows</text>

  <!-- Description lines -->
  <text x="202" y="132"
        class="t3"
        font-family='ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace'
        font-size="11">Django-based alert ingestion, health checks,</text>
  <text x="202" y="147"
        class="t3"
        font-family='ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace'
        font-size="11">AI analysis &amp; notification delivery</text>

  <!-- Pipeline stages row -->
  <text x="202" y="172" class="t3"  font-family='ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace' font-size="10">ingest</text>
  <text x="243" y="172" class="acc" font-family='ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace' font-size="10">→</text>
  <text x="257" y="172" class="t3"  font-family='ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace' font-size="10">check</text>
  <text x="295" y="172" class="acc" font-family='ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace' font-size="10">→</text>
  <text x="309" y="172" class="t3"  font-family='ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace' font-size="10">analyze</text>
  <text x="358" y="172" class="acc" font-family='ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace' font-size="10">→</text>
  <text x="372" y="172" class="t3"  font-family='ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace' font-size="10">notify</text>
</svg>
